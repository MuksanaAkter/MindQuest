services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: mindquest
      POSTGRES_PASSWORD: mindquest
      POSTGRES_DB: mindquest
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - mindquest_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mindquest -d mindquest"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  mindquest_pg:
